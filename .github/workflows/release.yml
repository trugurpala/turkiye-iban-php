name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', tools: composer }
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer run prepare-assets
      - run: composer test
      - run: composer analyse
      - run: composer archive --format=tar --file=turkiye-iban-php-${GITHUB_REF_NAME}
      - uses: softprops/action-gh-release@v2
        with: { generate_release_notes: true, files: turkiye-iban-php-${GITHUB_REF_NAME}.tar }
