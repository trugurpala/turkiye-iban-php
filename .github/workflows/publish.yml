name: Publish release assets
on: [push]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', tools: composer }
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer run prepare-assets
      - run: composer test
      - run: composer analyse
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create clean release archive
        run: git archive --format=tar.gz --prefix=turkiye-iban-php-${GITHUB_REF_NAME}/ --output=turkiye-iban-php-${GITHUB_REF_NAME}.tar.gz "${GITHUB_SHA}"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: turkiye-iban-php-${GITHUB_REF_NAME}.tar.gz
