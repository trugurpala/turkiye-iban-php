name: Hata bildirimi
description: Sentetik veriyle tekrar üretilebilen bir PHP istemci hatasını bildirin.
title: "[Hata]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gerçek IBAN, hesap sahibi, müşteri verisi, üretim logu veya bunları içeren ekran görüntüsü eklemeyin. Güvenlik açığını SECURITY.md içindeki özel kanaldan bildirin.
  - type: textarea
    id: summary
    attributes:
      label: Hatanın özeti
      description: Ne oldu, ne olmasını bekliyordunuz?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: En küçük tekrar örneği
      description: Yalnız sentetik veri kullanan en küçük PHP örneğini verin.
      render: php
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Paket ve PHP sürümü
      placeholder: "turkiye-iban v0.1.7, PHP 8.2"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Gizlilik onayı
      options:
        - label: Bu bildirimin gerçek IBAN veya kişisel finansal veri içermediğini onaylıyorum.
          required: true
