name: Bug report
description: Report a reproducible PHP client problem using synthetic data only.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include real IBANs, account holders, customer data, logs, or screenshots.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide a minimal PHP example with synthetic data only.
      render: php
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package and PHP version
      placeholder: "turkiye-iban v0.1.5, PHP 8.2"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I confirm this report contains no real IBAN or personal financial data.
          required: true
