name: Veri sözleşmesi düzeltmesi
description: Kuruluş kodu veya ortak IBAN sözleşmesi sorununu public kanıtla bildirin.
title: "[Veri]: "
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        Kanonik kuruluş verisi ana depoda tutulur. Bu formu PHP istemci uyumluluk sorunu veya ortak veri projesine yönlendirilecek bir düzeltme için kullanın.
        Gerçek IBAN, hesap numarası, müşteri adı, üretim logu veya kişisel finansal veri eklemeyin.
  - type: input
    id: provider_code
    attributes:
      label: Kuruluş kodu
      description: Yalnızca beş haneli sentetik kod yazın.
      placeholder: "00001"
    validations:
      required: true
  - type: textarea
    id: current_value
    attributes:
      label: Mevcut değer
      description: PHP istemcisi şu anda ne döndürüyor?
    validations:
      required: true
  - type: textarea
    id: expected_value
    attributes:
      label: Beklenen değer
      description: Ne döndürmeli ve neden?
    validations:
      required: true
  - type: input
    id: source_url
    attributes:
      label: Public kaynak
      description: Resmî veya bağımsız doğrulanabilir bir kaynağa bağlantı verin.
      placeholder: "https://..."
    validations:
      required: true
  - type: input
    id: accessed_at
    attributes:
      label: Erişim tarihi
      description: Kaynağın kontrol edildiği tarihi YYYY-MM-DD biçiminde yazın.
      placeholder: "2026-08-02"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Gizlilik onayı
      options:
        - label: Bu bildirimin gerçek IBAN veya kişisel finansal veri içermediğini onaylıyorum.
          required: true
