name: Data contract correction
description: Report a provider-code or shared IBAN contract issue with public evidence.
title: "[Data]: "
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        The canonical provider data lives in the main repository. Use this form for a PHP client compatibility issue or to route a correction to the shared data project.
        Do not include a real IBAN, account number, customer name, production log, or personal financial data.
  - type: input
    id: provider_code
    attributes:
      label: Provider code
      description: Five-digit synthetic code only.
      placeholder: "00001"
    validations:
      required: true
  - type: textarea
    id: current_value
    attributes:
      label: Current value
      description: What does the PHP client currently return?
    validations:
      required: true
  - type: textarea
    id: expected_value
    attributes:
      label: Expected value
      description: What should it return, and why?
    validations:
      required: true
  - type: input
    id: source_url
    attributes:
      label: Public source
      description: Link to an official or independently verifiable source.
      placeholder: "https://..."
    validations:
      required: true
  - type: input
    id: accessed_at
    attributes:
      label: Access date
      description: Date the source was checked, in YYYY-MM-DD format.
      placeholder: "2026-08-02"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I confirm this report contains no real IBAN or personal financial data.
          required: true
